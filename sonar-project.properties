sonar.projectKey=MedicitasFrontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js
# Cobertura generada por Vitest (reporter lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Cobertura fuera del gate por ahora (aun no hay suite de tests del frontend).
#     Al excluir todo de cobertura, "new lines to cover" queda en 0 y la condicion
#     de cobertura deja de bloquear. Revertir cuando existan tests reales.
sonar.coverage.exclusions=**/*

# --- Analisis: se excluye el codigo GENERADO (componentes shadcn de src/components/ui)
#     ademas de dist/node_modules/coverage. No es codigo escrito a mano, no debe contar issues.
sonar.exclusions=dist/**,node_modules/**,coverage/**,src/components/ui/**
