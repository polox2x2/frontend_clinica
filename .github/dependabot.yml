version: 2
updates:
  # Dependencias npm del frontend
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Actions usadas en los workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # Imagenes base del Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns:
          - "*"
